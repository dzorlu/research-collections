<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .lane { fill: #fafafa; stroke: #d0d0d0; }
      .head { font-size: 15px; font-weight: bold; fill: #111; }
      .sub  { font-size: 12px; fill: #555; }
      .step { font-size: 14px; fill: #111; }
      .file { font-size: 12px; fill: #4a4a4a; font-family: Menlo, Consolas, monospace; }
      .tok  { font-size: 13px; fill: #111; font-family: Menlo, Consolas, monospace; }
      .ours { fill: #e3efff; stroke: #3b78d8; }
      .theirs { fill: #eeeeee; stroke: #9a9a9a; }
      .num { font-size: 13px; font-weight: bold; fill: #fff; }
      .arrow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
<rect width="1120" height="820" fill="#ffffff"/>

  <!-- lanes -->
  <rect class="lane" x="20"  y="20" width="200" height="740" rx="6"/>
  <rect class="lane" x="235" y="20" width="330" height="740" rx="6"/>
  <rect class="lane" x="580" y="20" width="265" height="740" rx="6"/>
  <rect class="lane" x="860" y="20" width="240" height="740" rx="6"/>

  <text class="head" x="120" y="48" text-anchor="middle">Micro-batch</text>
  <text class="sub"  x="120" y="66" text-anchor="middle">trainer.py, actor.py</text>
  <text class="head" x="400" y="48" text-anchor="middle">Glm5NextModel.forward</text>
  <text class="sub"  x="400" y="66" text-anchor="middle">models/glm5_next/model.py</text>
  <text class="head" x="712" y="48" text-anchor="middle">Image rows</text>
  <text class="sub"  x="712" y="66" text-anchor="middle">image_embeddings.py</text>
  <text class="head" x="980" y="48" text-anchor="middle">Vision tower (frozen)</text>
  <text class="sub"  x="980" y="66" text-anchor="middle">glm5_next/vision.py</text>

  <!-- 1 the batch -->
  <rect class="ours" x="30" y="90" width="180" height="150" rx="6"/>
  <circle cx="48" cy="108" r="11" fill="#3b78d8"/><text class="num" x="48" y="113" text-anchor="middle">1</text>
  <text class="step" x="64" y="113">one micro-batch</text>
  <text class="tok" x="40" y="138">tokens</text>
  <text class="tok" x="40" y="155">[10,501,501,501,501,</text>
  <text class="tok" x="40" y="172"> 11,20,21]</text>
  <text class="tok" x="40" y="195">pixels or PNG bytes</text>
  <text class="tok" x="40" y="212">grid_thw [[1,4,4]]</text>
  <text class="file" x="40" y="232">host; trainer.py:98</text>
  <path class="arrow" d="M210,165 L250,165"/>

  <!-- 2 preprocess -->
  <rect class="ours" x="252" y="138" width="298" height="66" rx="6"/>
  <circle cx="270" cy="165" r="11" fill="#3b78d8"/><text class="num" x="270" y="170" text-anchor="middle">2</text>
  <text class="step" x="288" y="160">pop the image tensors: no SPMD</text>
  <text class="step" x="288" y="178">layout, every CP rank gets them all</text>
  <text class="file" x="288" y="197">model.py:115</text>
  <path class="arrow" d="M400,206 L400,228"/>

  <!-- 3 tok_embeddings -->
  <rect class="theirs" x="252" y="230" width="298" height="54" rx="6"/>
  <circle cx="270" cy="257" r="11" fill="#777"/><text class="num" x="270" y="262" text-anchor="middle">3</text>
  <text class="step" x="288" y="252">h = tok_embeddings(tokens)</text>
  <text class="file" x="470" y="252">model.py:183</text>
  <text class="tok" x="288" y="272">[e10, ?, ?, ?, ?, e11, e20, e21]</text>
  <path class="arrow" d="M400,284 L400,312"/>

  <!-- 4 write image features -->
  <rect class="ours" x="252" y="314" width="298" height="54" rx="6"/>
  <circle cx="270" cy="341" r="11" fill="#3b78d8"/><text class="num" x="270" y="346" text-anchor="middle">4</text>
  <text class="step" x="288" y="336">the 501 rows get the tower's output</text>
  <text class="file" x="288" y="356">model.py:191, :202</text>
  <path class="arrow" d="M550,341 L598,341"/>

  <!-- 5 positions -->
  <rect class="ours" x="600" y="300" width="230" height="110" rx="6"/>
  <circle cx="618" cy="318" r="11" fill="#3b78d8"/><text class="num" x="618" y="323" text-anchor="middle">5</text>
  <text class="step" x="634" y="323">find the image rows</text>
  <text class="tok" x="610" y="345">positions = tokens==501</text>
  <text class="tok" x="610" y="362">        = [1,2,3,4]</text>
  <text class="tok" x="610" y="379">rows/image = 4*4/2² = 4</text>
  <text class="file" x="610" y="400">:106, :43; CP slice :48, :85</text>
  <path class="arrow" d="M830,355 L878,355"/>

  <!-- 6 encode -->
  <rect class="ours" x="880" y="280" width="210" height="200" rx="6"/>
  <circle cx="898" cy="298" r="11" fill="#3b78d8"/><text class="num" x="898" y="303" text-anchor="middle">6</text>
  <text class="step" x="914" y="303">encode(image 0)</text>
  <text class="step" x="890" y="326">no_grad; bf16 on the GPU</text>
  <text class="file" x="890" y="344">vision.py:35</text>
  <text class="step" x="890" y="368">pixels of image 0:</text>
  <text class="step" x="890" y="386">slice, or decode the PNG</text>
  <text class="file" x="890" y="404">:158, :146 (image_embeddings)</text>
  <text class="step" x="890" y="428">patch embed → ViT blocks</text>
  <text class="step" x="890" y="446">→ patch merger (2x2)</text>
  <text class="file" x="890" y="464">miles_plugins vision.py:62</text>
  <path class="arrow" d="M985,480 L985,508"/>
  <text class="tok" x="985" y="528" text-anchor="middle">features [4, D]</text>
  <text class="tok" x="985" y="545" text-anchor="middle">[f0, f1, f2, f3]</text>

  <!-- 7 index_put -->
  <path class="arrow" d="M985,552 L985,585 L832,585"/>
  <rect class="ours" x="600" y="560" width="230" height="54" rx="6"/>
  <circle cx="618" cy="587" r="11" fill="#3b78d8"/><text class="num" x="618" y="592" text-anchor="middle">7</text>
  <text class="step" x="634" y="582">h[positions] = features</text>
  <text class="file" x="634" y="602">image_embeddings.py:132</text>
  <path class="arrow" d="M600,587 L552,587"/>
  <rect class="theirs" x="252" y="560" width="298" height="54" rx="6"/>
  <text class="tok" x="262" y="582">h = [e10,f0,f1,f2,f3,e11,e20,e21]</text>
  <text class="sub" x="262" y="602">the same tensor, four rows replaced</text>
  <path class="arrow" d="M400,614 L400,642"/>

  <!-- 8 layers, loss -->
  <rect class="theirs" x="252" y="644" width="298" height="54" rx="6"/>
  <circle cx="270" cy="671" r="11" fill="#777"/><text class="num" x="270" y="676" text-anchor="middle">8</text>
  <text class="step" x="288" y="666">transformer layers → norm → logits</text>
  <text class="file" x="288" y="686">model.py:193</text>
  <path class="arrow" d="M400,698 L400,726"/>
  <rect class="ours" x="252" y="712" width="298" height="40" rx="6"/>
  <text class="step" x="262" y="729">loss on each CP rank's own tokens</text>
  <text class="file" x="262" y="746">loss.py</text>

  <!-- tower box note -->
  <rect class="ours" x="880" y="620" width="210" height="110" rx="6"/>
  <text class="step" x="890" y="642">Loaded once from the HF</text>
  <text class="step" x="890" y="660">checkpoint (model.visual.*)</text>
  <text class="step" x="890" y="678">into __dict__: FSDP, optimizer</text>
  <text class="step" x="890" y="696">and DCP never see it</text>
  <text class="file" x="890" y="718">trainer.py:87 → model.py:107</text>

  <!-- legend -->
  <rect class="ours"   x="30" y="778" width="18" height="14" rx="3"/><text class="sub" x="54" y="790">#4588</text>
  <rect class="theirs" x="120" y="778" width="18" height="14" rx="3"/><text class="sub" x="144" y="790">existing torchtitan GLM-5.3 text model</text>
  <text class="sub" x="420" y="790">example: one 4x4-patch image, merge 2x2, so placeholder 99 became four 501 tokens</text>
</svg>
